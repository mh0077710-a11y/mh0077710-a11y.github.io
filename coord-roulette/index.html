<script>
      /* ============================================================
         スロット型ルーレット共通の動き（今日の1曲マシンと同じ型）
         大きなボタンを押すと、写真と名前が約2秒、速く→ゆっくりと
         切り替わって止まり、金枠の結果カードが出る。何度でも引き直せる
         ============================================================ */
      function makeSlotMachine(cfg) {
        var drawBtn = cfg.drawBtn, againBtn = cfg.againBtn;
        var stageImg = cfg.stageImg, placeholder = cfg.placeholder;
        var nowEl = cfg.nowEl, statusEl = cfg.statusEl, resultEl = cfg.resultEl;
        if (!drawBtn || !resultEl) return;
        var spinning = false;
        /* 画像の先読みは、ページを開いた直後には行わない。
           対象セクション（ステージ）が画面に近づいたとき、または「引く」ボタンへの
           最初のタップ／ホバー／フォーカス時にだけ開始する（軽量化のため） */
        var slotPreloaded = false;
        function preload() {
          if (slotPreloaded) return;
          slotPreloaded = true;
          cfg.items().forEach(function (it) { var im = new Image(); im.src = it.img; });
        }
        var slotObserveTarget = cfg.stage || drawBtn;
        if ("IntersectionObserver" in window && slotObserveTarget) {
          var slotIO = new IntersectionObserver(function (entries) {
            if (entries[0].isIntersecting) {
              preload();
              slotIO.disconnect();
            }
          }, { rootMargin: "600px 0px" });
          slotIO.observe(slotObserveTarget);
        }
        [drawBtn, againBtn].forEach(function (btn) {
          if (!btn) return;
          btn.addEventListener("pointerenter", preload);
          btn.addEventListener("touchstart", preload, { passive: true });
          btn.addEventListener("focus", preload);
        });
        function showItem(item) {
          placeholder.style.display = "none";
          stageImg.style.display = "block";
          stageImg.src = item.img;
          stageImg.alt = item.alt || item.name;
          nowEl.textContent = item.name;
        }
        function draw() {
          var items = cfg.items();
          if (!items.length || spinning) return;
          preload();
          spinning = true;
          drawBtn.disabled = true;
          resultEl.classList.remove("show");
          statusEl.textContent = cfg.spinningText;
          var finalIndex = Math.floor(Math.random() * items.length);
          var finalItem = items[finalIndex];
          /* 切り替え間隔：速く始まり→さらに速く→最後はゆっくり減速（合計 約2.1秒） */
          var delays = [];
          var total = 0;
          var d = 95;
          while (total < 1250) { delays.push(d); total += d; if (d > 42) d -= 9; }
          d = 60;
          while (total < 2050) { delays.push(d); total += d; d = Math.round(d * 1.45); }
          delays.push(320);
          var step = 0;
          var cursor = Math.floor(Math.random() * items.length);
          function tick() {
            if (step < delays.length) {
              cursor = (cursor + 1 + Math.floor(Math.random() * 3)) % items.length;
              showItem(items[cursor]);
              setTimeout(tick, delays[step]);
              step++;
            } else {
              showItem(finalItem);
              finish(finalItem);
            }
          }
          tick();
        }
        function finish(item) {
          spinning = false;
          drawBtn.disabled = false;
          statusEl.textContent = cfg.doneText;
          cfg.fill(item);
          resultEl.classList.add("show");
          setTimeout(function () {
            resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }, 120);
        }
        drawBtn.addEventListener("click", draw);
        if (againBtn) {
          againBtn.addEventListener("click", function () {
            draw();
            cfg.stage.scrollIntoView({ behavior: "smooth", block: "center" });
          });
        }
      }

      /* ---------- 今日のコーデルーレット ---------- */
      /* 候補は衣装アルバム記事（https://michijapan.seesaa.net/article/521937587.html）の4コーデ。
         商品ボタンは、そのコーデの中心の服について記事側にある商品リンク（a_id=5868290）のみを付ける */
      (function () {
        var COORDS = [
          {
